; Installed as /usr/local/etc/php-fpm.d/zz-www.conf: php-fpm includes php-fpm.d/*.conf in
; alphabetical order and the last value wins, so this must sort after the base image's www.conf.
; ${VAR} is expanded from the container environment at startup; the defaults are the ENV lines
; in nginx.Dockerfile. Check the effective values with `php-fpm -tt`.
[www]
pm = ${FPM_PM}
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
pm.max_requests = 200
pm.process_idle_timeout = 10s
