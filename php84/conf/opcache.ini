; Installed as /usr/local/etc/php/conf.d/zz-opcache.ini (conf.d is the only directory PHP scans).
; OPcache is always on; ${VAR} is expanded from the container environment at startup, with the
; defaults set by the ENV lines in nginx.Dockerfile. Check with `php-fpm -i | grep opcache`.
opcache.enable=1
opcache.memory_consumption=${OPCACHE_MEMORY_CONSUMPTION}
opcache.max_accelerated_files=${OPCACHE_MAX_ACCELERATED_FILES}
opcache.validate_timestamps=${OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq=${OPCACHE_REVALIDATE_FREQ}
